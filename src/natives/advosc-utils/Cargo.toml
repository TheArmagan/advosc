[package]
name = "advosc-utils"
version = "0.1.0"
edition = "2021"
description = "Native utilities for ADVOSC - VRChat OSC tools"

[dependencies]
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
openvr = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
