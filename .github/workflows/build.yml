name: Build

# Just checks that the app still builds. Making the installer is the release
# workflow's job, this one stays cheap because Windows runners bill at 2x.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "LICENSE"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
