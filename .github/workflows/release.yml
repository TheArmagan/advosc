name: Release

# Two ways to cut a release, both of which take the version from package.json:
#
#   Push a tag:  bump package.json, then
#                git commit -am "0.1.1" && git tag v0.1.1 && git push --follow-tags
#
#   Actions tab: run this workflow with "Publish a release" ticked, and it tags
#                the current commit with the version already in package.json.
#
# Running it from the Actions tab without ticking that box only builds, and
# attaches the installer to the run so you can test it. Nothing gets published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tags the current commit with the package.json version)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Has to be Windows. The build shells out to xcopy, the app is Windows only,
    # and the Squirrel maker needs Windows tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # package.json is the source of truth. Squirrel takes the package version
      # from it, so a tag that disagrees would publish a v0.1.1 release full of
      # 0.1.0 artifacts.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $version) {
              throw "Tag $tag does not match package.json version $version. Bump package.json, or retag to v$version."
            }
          } else {
            $tag = "v$version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version as $tag"

      # Squirrel shells out to a 7-Zip binary that electron-winstaller puts in
      # place from an install script. bun skips install scripts unless the
      # package is in trustedDependencies, and when it is skipped Squirrel fails
      # deep inside .NET with a stack trace that says nothing useful.
      - name: Verify Squirrel tooling
        shell: pwsh
        run: |
          $sevenZip = 'node_modules/electron-winstaller/vendor/7z.exe'
          if (-not (Test-Path $sevenZip)) {
            throw "$sevenZip is missing, so Squirrel would fail. electron-winstaller's install script did not run. Check that it is still listed in trustedDependencies in package.json."
          }

      - name: Build installer
        run: bun run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: advosc-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/ADVOSC-Setup.exe
            out/make/zip/win32/x64/*.zip

      # RELEASES and the nupkg are what the auto updater reads, so they have to
      # be on the release even though nobody downloads them by hand.
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/make/squirrel.windows/x64/ADVOSC-Setup.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/zip/win32/x64/*.zip
